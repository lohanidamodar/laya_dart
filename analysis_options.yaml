include: package:lints/recommended.yaml
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/tokenizer/nfc_data.g.dart
    - lib/src/routing/unicode_data.g.dart
linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - prefer_final_fields
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
